<!DOCTYPE html>
<html>
<head>
<title>Register - GrowFastPK</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f3f4f6;
margin:0;
}

.container{
max-width:400px;
margin:50px auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px #ddd;
text-align:center;
}

h1{
color:#111827;
}

input{
width:90%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:95%;
padding:12px;
background:#16a34a;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

a{
text-decoration:none;
color:#2563eb;
}
</style>

</head>

<body>

<div class="container">

<h1>Create Account</h1>

<input type="text" placeholder="Full Name">

<input type="email" placeholder="Email">

<input type="text" placeholder="WhatsApp Number">

<input type="password" placeholder="Create Password">

<button>Create Account</button>

<p>Already have an account?
<a href="login.html">Login</a></p>

</div>

</body>
</html>
